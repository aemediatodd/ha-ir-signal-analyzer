substitutions:
  name: xiao-ir-transmitter
  friendly_name: XIAO IR Transmitter

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: false

esp32:
  board: seeed_xiao_esp32c3
  framework:
    type: esp-idf

logger:

api:
  id: api_id
  encryption:
    key: !secret api_encryption_key
  actions:
    - action: send_raw
      variables:
        code: int[]
        carrier_frequency: float
      then:
        - remote_transmitter.transmit_raw:
            code: !lambda return code;
            carrier_frequency: !lambda return carrier_frequency;

    - action: send_nec
      variables:
        address: int
        command: int
      then:
        - remote_transmitter.transmit_nec:
            address: !lambda return address;
            command: !lambda return command;

    # Send a TCL command frame and full-state frame with device-local timing.
    - action: send_raw_pair
      variables:
        first_code: int[]
        second_code: int[]
        delay_ms: int
        carrier_frequency: float
      then:
        - remote_transmitter.transmit_raw:
            code: !lambda return first_code;
            carrier_frequency: !lambda return carrier_frequency;
        - delay: !lambda return delay_ms;
        - remote_transmitter.transmit_raw:
            code: !lambda return second_code;
            carrier_frequency: !lambda return carrier_frequency;

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Fallback"

captive_portal:

button:
  - platform: restart
    name: Restart
    entity_category: diagnostic

remote_transmitter:
  id: ir_tx
  pin: GPIO3
  carrier_duty_percent: 50%
  non_blocking: true

# Official ESPHome TCL112 controller for basic power, mode, temperature, fan,
# and vertical-swing control. Advanced features use send_raw_pair above.
climate:
  - platform: tcl112
    name: TCL Air Conditioner
    transmitter_id: ir_tx
    supports_heat: true
    supports_cool: true

infrared:
  - platform: ir_rf_proxy
    name: IR Proxy Transmitter
    id: ir_proxy_tx
    remote_transmitter_id: ir_tx
